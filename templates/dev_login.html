{% extends "base.html" %}
{% block content %}
<main class="relative mx-auto max-w-2xl px-6 py-12 lg:px-12">
  <div class="cyber-card p-8 sm:p-10">
    <h1 class="heading text-3xl font-bold">Войти как пользователь</h1>
    <p class="mt-2 text-sm leading-relaxed text-muted">
      Выберите одного из подготовленных пользователей, чтобы протестировать ставки, баланс и оплату.
    </p>
    <div class="mt-6 space-y-2.5">
      {% for u in users %}
      <form method="post" action="/auth/dev/login">
        <input type="hidden" name="username" value="{{ u.username }}">
        <button type="submit" class="flex w-full items-center justify-between gap-4 rounded border border-white/[0.08] bg-white/[0.03] p-4 text-left transition hover:-translate-y-0.5 hover:border-violet hover:bg-white/[0.06]">
          <div class="flex items-center gap-3">
            <span class="flex h-10 w-10 items-center justify-center rounded-full bg-gradient-to-br from-[#7c5cfc] to-[#f0a500] text-sm font-bold">{{ u.username[:2]|upper }}</span>
            <div>
              <p class="text-base font-semibold">{{ u.username }}</p>
              <p class="text-xs uppercase tracking-wide text-muted">{{ u.country }} · {% if u.country == 'AM' %}IDram{% elif u.country == 'RU' %}YooKassa{% else %}Stripe{% endif %}</p>
            </div>
          </div>
          <iconify-icon icon="lucide:log-in" class="text-xl text-violet"></iconify-icon>
        </button>
      </form>
      {% endfor %}
    </div>
    <div class="mt-6 flex gap-3">
      <a href="/auth/login" class="btn btn-ghost btn-sm">Обычный вход</a>
      <a href="/auth/register" class="btn btn-violet btn-sm">Регистрация</a>
    </div>
  </div>
</main>
{% endblock %}
